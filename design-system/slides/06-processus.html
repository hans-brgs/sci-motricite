<!-- @dsCard group="Slides" viewport="1280x720" name="Processus en quatre temps" subtitle="La boucle de l'intervention, étapes numérotées" -->
<!DOCTYPE html><html lang="fr" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
.slide{width:1280px;height:720px;position:relative;overflow:hidden;color:var(--ink-50);font-family:var(--font-sans);
background:radial-gradient(50% 60% at 8% 0%,rgba(21,184,167,.30) 0,rgba(21,184,167,0) 72%),radial-gradient(45% 60% at 97% 100%,rgba(167,86,246,.26) 0,rgba(167,86,246,0) 72%),#0e1622}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;
background-image:linear-gradient(rgba(234,240,247,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(234,240,247,.06) 1px,transparent 1px);
background-size:64px 64px;background-position:center center;
-webkit-mask-image:radial-gradient(ellipse 54% 58% at 50% 50%,#000 0%,rgba(0,0,0,.55) 40%,rgba(0,0,0,.12) 70%,transparent 92%);
mask-image:radial-gradient(ellipse 54% 58% at 50% 50%,#000 0%,rgba(0,0,0,.55) 40%,rgba(0,0,0,.12) 70%,transparent 92%)}
.slide>*{position:relative;z-index:1}
.pad{position:absolute;inset:52px 72px}
.chrome{position:absolute;top:34px;left:72px;right:72px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.chrome .a{color:var(--brand-teal)}.chrome .b{color:#6b7a90}
.foot{position:absolute;bottom:30px;left:72px;right:72px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;color:#4a5a70;text-transform:uppercase}
h1,h2,h3{margin:0;font-family:var(--font-display);letter-spacing:-.03em;line-height:1.04}
.eyebrow{font-family:var(--font-mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#93a1b5}
.rule{width:56px;height:3px;background:linear-gradient(90deg,#15b8a7,#a756f6)}
</style></head><body><div class="slide"><div class="chrome"><span class="a">Biomécanique</span><span class="b">Quel intérêt ?</span></div>
<div class="pad" style="display:flex;flex-direction:column;justify-content:center">
<div class="eyebrow" style="color:var(--brand-teal)">Objectiver, comprendre, agir</div>
<h2 style="font-size:48px;font-weight:600;margin-top:16px">La boucle de l'intervention</h2>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:60px">
<div style="border-top:2px solid #15b8a7;padding-top:22px"><div style="font-family:var(--font-mono);font-size:30px;color:#15b8a7">01</div><div style="font-family:var(--font-mono);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#eaf0f7;margin:12px 0 8px">Mesurer</div><div style="font-size:16px;color:#6b7a90;line-height:1.5">Objectiver l'état présent</div></div><div style="border-top:2px solid #a756f6;padding-top:22px"><div style="font-family:var(--font-mono);font-size:30px;color:#a756f6">02</div><div style="font-family:var(--font-mono);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#eaf0f7;margin:12px 0 8px">Comprendre</div><div style="font-size:16px;color:#6b7a90;line-height:1.5">Interpréter la valeur</div></div><div style="border-top:2px solid #15b8a7;padding-top:22px"><div style="font-family:var(--font-mono);font-size:30px;color:#15b8a7">03</div><div style="font-family:var(--font-mono);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#eaf0f7;margin:12px 0 8px">Cibler / intervenir</div><div style="font-size:16px;color:#6b7a90;line-height:1.5">Choisir l'action</div></div><div style="border-top:2px solid #a756f6;padding-top:22px"><div style="font-family:var(--font-mono);font-size:30px;color:#a756f6">04</div><div style="font-family:var(--font-mono);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#eaf0f7;margin:12px 0 8px">Ré-évaluer</div><div style="font-size:16px;color:#6b7a90;line-height:1.5">Re-mesurer à l'identique</div></div>
</div></div>
<div class="foot"><span>Biomécanique · CM 01</span><span>06 / 09</span></div></div></body></html>
