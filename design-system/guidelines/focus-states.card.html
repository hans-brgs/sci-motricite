<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-page);color:var(--text-body);font:var(--type-body)}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:16px;align-items:center">
<span style="padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--accent);box-shadow:var(--shadow-focus);font:var(--type-small);color:var(--text-title)">champ focus</span>
<span style="padding:9px 16px;border-radius:var(--radius-sm);background:var(--accent);color:#04302b;box-shadow:var(--shadow-focus);font:var(--type-small);font-weight:500">bouton focus</span>
<span style="padding:9px 16px;border-radius:var(--radius-sm);background:var(--accent-2);color:#1e0a35;box-shadow:var(--shadow-focus-violet);font:var(--type-small);font-weight:500">focus violet</span>
<span style="padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--border-default);opacity:.45;font:var(--type-small)">désactivé</span></div></body></html>
