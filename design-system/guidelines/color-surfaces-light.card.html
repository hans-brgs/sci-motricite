<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-page);color:var(--text-body);font:var(--type-body)}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:12px"><div style="flex:1"><div style="height:56px;border-radius:var(--radius-sm);background:var(--bg-page);border:1px solid var(--border-subtle)"></div><div style="font:var(--type-code);font-size:11px;color:var(--text-title);margin-top:6px">page</div><div style="font:var(--type-code);font-size:10px;color:var(--text-faint)">--bg-page</div></div><div style="flex:1"><div style="height:56px;border-radius:var(--radius-sm);background:var(--bg-subtle);border:1px solid var(--border-subtle)"></div><div style="font:var(--type-code);font-size:11px;color:var(--text-title);margin-top:6px">subtle</div><div style="font:var(--type-code);font-size:10px;color:var(--text-faint)">--bg-subtle</div></div><div style="flex:1"><div style="height:56px;border-radius:var(--radius-sm);background:var(--bg-sunken);border:1px solid var(--border-subtle)"></div><div style="font:var(--type-code);font-size:11px;color:var(--text-title);margin-top:6px">sunken</div><div style="font:var(--type-code);font-size:10px;color:var(--text-faint)">--bg-sunken</div></div><div style="flex:1"><div style="height:56px;border-radius:var(--radius-sm);background:var(--surface-code);border:1px solid var(--border-subtle)"></div><div style="font:var(--type-code);font-size:11px;color:var(--text-title);margin-top:6px">code</div><div style="font:var(--type-code);font-size:10px;color:var(--text-faint)">--surface-code</div></div></div>
<div style="margin-top:14px;font:var(--type-small);color:var(--text-body)">Texte courant <span style="color:var(--text-muted)">secondaire</span> <span style="color:var(--text-faint)">discret</span> <a href="#" style="color:var(--text-link)">lien teal</a></div></body></html>
