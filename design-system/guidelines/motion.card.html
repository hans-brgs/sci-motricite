<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-page);color:var(--text-body);font:var(--type-body)}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:12px;font:var(--type-code);font-size:11px;color:var(--text-muted)">
